<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hello, Friends!</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="poster-wrapper">
            <div class="bounty-poster">
                <div class="header-section">
                    <div class="header-text">Hello</div>
                </div>

                <div class="image-section">
                    <div class="image-border">
                        <img src="cat.png" alt="A cat" />
                    </div>
                    <div class="image-border">
                        <img src="dog.png" alt="A dog" />
                    </div>
                </div>

                <p class="description-text">
                    We are from DuoGPT, nice to meet you
                </p>

                <div class="banner-section">
                    <span class="decoration-left">~</span>
                    <span class="banner-text">MEET OUR FRIENDS</span>
                    <span class="decoration-right">~</span>
                </div>

                <div class="name-section">
                    <div class="name-text">CAT &amp; DOG</div>
                </div>

                <div class="footer-section">
                    <div class="bounty-row">
                        <span class="currency-symbol">♥</span>
                        <span class="bounty-amount">NAPS &amp; TREATS</span>
                    </div>
                    <img
                        src="sutd-logo.png"
                        alt="SUTD"
                        class="sutd-logo"
                    />
                </div>
            </div>
        </div>
    </body>
</html>
