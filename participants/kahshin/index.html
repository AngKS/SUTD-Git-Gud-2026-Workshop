<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bounty Poster — Kah Shin</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="poster-wrapper">
            <div class="bounty-poster">
                <div class="header-section">
                    <div class="header-text">🐼 WANTED 🐼</div>
                </div>

                <div class="image-section">
                    <div class="image-border">
                        <img src="profile.png" alt="Kah Shin" />
                    </div>
                </div>

                <div class="banner-section">
                    <span class="decoration-left">🎋</span>
                    <span class="banner-text">DEAD OR ALIVE</span>
                    <span class="decoration-right">🎋</span>
                </div>

                <div class="name-section">
                    <div class="name-text">Kah Shin Ang</div>
                </div>

                <div class="footer-section">
                    <div class="bounty-row">
                        <span class="currency-symbol">🎍</span>
                        <span class="bounty-amount">1,000 Bamboo</span>
                    </div>
                    <img
                        src="sutd-logo.png"
                        alt="SUTD"
                        class="sutd-logo"
                    />
                </div>
            </div>
        </div>
    </body>
</html>
