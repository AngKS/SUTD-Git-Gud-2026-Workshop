<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bounty Poster — example</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <!-- This is a finished example so the gallery is never empty.
             Yours will sit right next to it once your PR is merged. -->
    <div id="poster-wrapper">
        <div class="bounty-poster">
            <div class="header-section">
                <div class="header-text">john average</div>
            </div>

            <div class="image-section">
                <div class="image-border">
                    <img src="profile.png" alt="Profile" />
                </div>
            </div>

            <div class="banner-section">
                <span class="decoration-left">~</span>
                <span class="banner-text">just kill him tbh</span>
                <span class="decoration-right">~</span>
            </div>

            <div class="name-section">
                <div class="name-text">hv</div>
            </div>

            <div class="footer-section">
                <div class="bounty-row">
                    <span class="currency-symbol">฿</span>
                    <span class="bounty-amount">0 dollar</span>
                </div>
                <img src="sutd-logo.png" alt="SUTD" class="sutd-logo" />
            </div>
        </div>
    </div>
</body>

</html>
