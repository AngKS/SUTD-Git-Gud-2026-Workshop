<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bounty Poster</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="poster-wrapper">
            <div class="bounty-poster">
                <div class="header-section">
                    <div class="header-text">BLUEPRINT</div>
                </div>

                <div class="image-section">
                    <div class="image-border">
                        <img src="me.png" alt="Julius Shiu" />
                    </div>
                </div>

                <div class="banner-section">
                    <span class="decoration-left">+</span>
                    <span class="banner-text">DD WARRIOR</span>
                    <span class="decoration-right">+</span>
                </div>

                <div class="name-section">
                    <div class="name-text">JULIUS SHIU</div>
                </div>

                <div class="footer-section">
                    <div class="bounty-row">
                        <span class="currency-symbol">฿</span>
                        <span class="bounty-amount">6,090,202,600-</span>
                    </div>
                    <img
                        src="sutd-logo.png"
                        alt="SUTD"
                        class="sutd-logo"
                    />
                </div>
            </div>
        </div>
    </body>
</html>
